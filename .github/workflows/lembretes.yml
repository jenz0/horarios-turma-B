name: Lembretes

on:
  schedule:
    # a cada 15 min entre 09:00 e 00:00 UTC = 06:00 às 21:00 em Salvador.
    # Minutos deslocados (4/19/34/49): o GitHub descarta execuções sob carga,
    # e os minutos redondos são os mais congestionados.
    # Execução descartada é recuperada pela próxima: enviar.js olha 30 min
    # para trás e o estado em push/estado/ evita aviso repetido.
    - cron: "4,19,34,49 9-23 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "normal | teste | seco"
        required: false
        default: "teste"

jobs:
  enviar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install web-push --no-save

      - name: Restaurar o que já foi enviado hoje
        uses: actions/cache/restore@v4
        with:
          path: push/estado
          key: enviados-${{ github.run_id }}
          restore-keys: enviados-

      - name: Enviar lembretes
        env:
          VAPID_PUBLIC:  ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_SUB:      ${{ secrets.PUSH_SUB }}
        run: |
          case "${{ github.event.inputs.modo }}" in
            teste) node push/enviar.js --teste ;;
            seco)  node push/enviar.js --seco  ;;
            *)     node push/enviar.js         ;;
          esac

      - name: Guardar o que foi enviado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: push/estado
          key: enviados-${{ github.run_id }}
